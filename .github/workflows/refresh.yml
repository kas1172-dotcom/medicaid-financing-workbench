name: Refresh dashboard data

# This workflow runs mfw build — the non-interactive build command.
# It never prompts for files. For any stale manual source, it proceeds
# with the last-good data in data/current/ and surfaces the "as of"
# date on the site rather than failing.
#
# To ingest new manual uploads, run `mfw refresh` locally, commit the
# updated data/current/ files, and push before triggering this action.

on:
  workflow_dispatch:         # manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Build dashboard (non-interactive)
        run: mfw build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/dashboard_data.json outputs/charts/
          git diff --cached --quiet || git commit -m "chore: refresh dashboard data [$(date -u +%Y-%m-%d)]"
          git push

name: Refresh site data

# Fetches live API sources (CMS-64, Census ACS) then rebuilds and publishes
# the dashboard. Manual-upload sources (KFF provider taxes, KFF CBO
# allocations, CMS managed care enrollment) cannot be automated: ingest those
# locally with `mfw refresh`, commit data/current/, then re-run this action.
#
# Required secret: ANTHROPIC_API_KEY (for LLM narrative; falls back to
# reviewed stubs if absent: the action will not fail without it).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch live API sources
        run: mfw refresh
        # Updates data/current/ provenance for cms64 and census_acs.
        # Skips manual-upload sources gracefully (no inbox files present).

      - name: Build dashboard
        run: mfw build --live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current/ dashboard/dashboard_data.json dashboard_data.json outputs/charts/
          git diff --cached --quiet || git commit -m "chore: refresh dashboard data [$(date -u +%Y-%m-%d)]"
          git push

# =============================================================================
# Phase 1: Provider-Tax Source Registry
# =============================================================================
# Generated: 2026-06-09
# Method: Web search + HTTP fetch verification for all 50 states + DC.
#
# confidence levels:
#   verified  : URL was fetched and page/document plausibly contains rate data
#   likely    : credible primary source found; rate not confirmed from fetch
#                (403/redirect/binary PDF) but confirmed via secondary sources
#   not_found : no findable primary source; or state has no hospital provider tax
#
# source_type:  statute | regulation | agency_page | budget_pdf | cms_waiver | other
# format:       html_table | html_text | pdf_table | pdf_text | image | unknown
#
# IMPORTANT: Phase 2 scrapers should be built ONLY for "verified" sources.
# "likely" sources require manual inspection before coding.
# "not_found" states fall back to seed data (clearly labeled).
#
# Key structural finding: Most states do NOT fix the rate in statute: they
# delegate rate-setting to the state agency, which publishes annual notices.
# The statute URL is therefore the authoritative REFERENCE, but the actual
# current rate often lives in an agency bulletin, preprint, or CMS SPA.
# =============================================================================


# =============================================================================
# Policy parameters: 2025 federal budget reconciliation law (H.R.1)
# =============================================================================
# This is the control panel. Change a number here and every downstream analysis
# recomputes. The point of the workbench: the analyst reasons about policy by
# editing parameters, not by rewriting code.
#
# Every value carries a `source` so a reader can trace it. CBO scores and the
# statutory schedule are from KFF's "5 Key Facts About Medicaid and Provider
# Taxes" (Dec 2025, updated Feb 2026) and the KFF reconciliation law tracker.
# =============================================================================

meta:
  law_name: "One Big Beautiful Bill Act (H.R.1), 2025 reconciliation law"
  baseline_fiscal_year: 2024
  last_reviewed: "2026-06"

provider_tax:
  # ── Statutory schedule ────────────────────────────────────────────────────
  # The hold-harmless limit for EXISTING non-exempt taxes in expansion states
  # phases down from 6.0% to 3.5% of net patient revenue.
  current_cap_pct: 6.0
  target_cap_pct: 3.5
  phasedown_start_year: 2028       # FFY2028 is the first year the ceiling steps down
  phasedown_end_year: 2032         # reaches 3.5% in FFY2032 (0.5pp/yr × 5 steps)
  phasedown_step_pct_per_year: 0.5
  new_tax_holdharmonless_limit_pct: 0  # new/increased taxes face a 0% hold-harmless immediately
  freeze_effective: "2025-07"          # new/increased taxes frozen as of July 2025

  # ── Exempt vs. subject provider classes ──────────────────────────────────
  # Nursing facility and ICF/IID taxes are STATUTORILY EXEMPT from the
  # phase-down. Only the classes listed under subject_classes face the new cap.
  exempt_classes:
    - nursing_facility
    - icf_iid
  subject_classes:
    - hospital
    - mco
    - ambulance
    - other

  # ── Key empirical anchors (KFF, Dec 2025 / Feb 2026) ──────────────────────
  n_expansion_states_noneexempt_above_cap: 31   # expansion states with any non-exempt tax > 3.5%
  n_expansion_states_hospital_above_cap: 28     # of those 31, states with hospital tax > 3.5%
  provider_tax_median_nonfed_share_pct: 18      # provider taxes fund a median 18% of non-fed share

  source: "KFF, 5 Key Facts About Medicaid and Provider Taxes (Dec 2025 / updated Feb 2026)"

federal_state_split:
  # FFY2024 aggregate federal/state cost-sharing across all Medicaid.
  federal_pct: 65
  state_pct: 35
  note: "Aggregate weighted average; individual states vary widely with FMAP."
  source: "CMS, FMAP data FFY2024"

work_requirements:
  hours_per_month: 80
  verification_months: 6          # states must verify at least every 6 months
  lookback_months: 1              # statutory minimum lookback
  # Calibration anchors for the coverage-loss model (see analysis/work_requirements.py)
  arkansas_coverage_loss: 18000   # documented losses under the 2018 attempt
  # KFF: most subject adults already work or qualify for an exemption; the modeled
  # loss is driven by administrative churn, not actual non-work.
  already_working_or_exempt_share: 0.92
  administrative_churn_rate: 0.18 # share of compliant enrollees at risk of
                                  # procedural disenrollment (calibrated to AR/GA)
  source: "KFF, A Closer Look at the Work Requirement Provisions (2025)"

cbo_scores:
  # ── Total Medicaid reduction ───────────────────────────────────────────────
  total_medicaid_reduction_10yr_billion: 911
  work_requirements_reduction_10yr_billion: 326
  sdp_provision_reduction_10yr_billion: 149       # other provisions (SDP/cost-sharing)
  coverage_loss_millions: 10

  # ── Provider-tax provisions: $226B total, broken out by sub-provision ─────
  provider_tax_total_10yr_billion: 226
  provider_tax_new_increased_10yr_billion: 89      # effective prohibition on new/increased taxes
  provider_tax_reduced_holdharmonless_10yr_billion: 102   # reduced hold-harmless limit (expansion states)
  provider_tax_uniformity_waiver_10yr_billion: 35  # uniformity-waiver revisions

  source: "CBO via KFF reconciliation law tracker (2025); provider-tax decomposition from KFF 5 Key Facts"

hcbs_risk_weights:
  # Weights for the 0-10 HCBS vulnerability index (must sum to 1.0).
  # Rationale: HCBS is an OPTIONAL Medicaid benefit, historically the first cut
  # when states face fiscal pressure. The index combines exposure (how much a
  # state relies on at-risk financing) with stakes (how much HCBS is on the line).
  hcbs_spending_share: 0.30       # how much of the program is HCBS (stakes)
  provider_tax_reliance: 0.30     # reliance on the financing now capped (exposure)
  federal_cut_magnitude: 0.25     # projected dollar hit (exposure)
  nonfederal_share_strain: 0.15   # how much of the bill the state already carries
